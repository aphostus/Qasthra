<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Silver and obsidian faceted gem" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Silver and obsidian faceted gem</title>
  <defs>
    <!-- Silver facets: metallic with banded falloff -->
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f4f4"/><stop offset=".45" stop-color="#c2c2c2"/><stop offset=".55" stop-color="#b0b0b0"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#dcdcdc"/><stop offset=".6" stop-color="#c8c8c8"/><stop offset="1" stop-color="#a6a6a6"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dedede"/><stop offset=".5" stop-color="#b4b4b4"/><stop offset=".6" stop-color="#a0a0a0"/><stop offset="1" stop-color="#787878"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8a8a8"/><stop offset=".5" stop-color="#707070"/><stop offset="1" stop-color="#3e3e3e"/></linearGradient>
    <linearGradient id="t5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c0c0c0"/><stop offset=".5" stop-color="#8e8e8e"/><stop offset="1" stop-color="#585858"/></linearGradient>
    <linearGradient id="t7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafafa"/><stop offset=".5" stop-color="#cfcfcf"/><stop offset=".6" stop-color="#bcbcbc"/><stop offset="1" stop-color="#939393"/></linearGradient>

    <!-- Obsidian facets: glassy near-black with a faint cool tint -->
    <linearGradient id="b6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#404348"/><stop offset=".5" stop-color="#1f2024"/><stop offset="1" stop-color="#0c0c0e"/></linearGradient>
    <linearGradient id="b8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#383b40"/><stop offset=".5" stop-color="#191a1d"/><stop offset="1" stop-color="#08080a"/></linearGradient>
    <linearGradient id="b9" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e3136"/><stop offset=".5" stop-color="#141518"/><stop offset="1" stop-color="#060607"/></linearGradient>
    <linearGradient id="b10" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2024"/><stop offset=".5" stop-color="#0c0d0f"/><stop offset="1" stop-color="#020203"/></linearGradient>
    <linearGradient id="b11" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2c31"/><stop offset=".5" stop-color="#101113"/><stop offset="1" stop-color="#040405"/></linearGradient>

    <!-- environment reflection streak on glass facets -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#dfe6f2" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#dfe6f2" stop-opacity=".02"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- overall light falloff -->
    <linearGradient id="light" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
    <!-- depth inside the body: darker toward the lower-right edge -->
    <radialGradient id="vignette" cx=".38" cy=".3" r=".8">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".5" stop-color="#c8c8c8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7a7f88" stop-opacity=".6"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>

    <clipPath id="gem"><polygon points="270,36 400,170 440,330 330,476 170,440 80,310 120,150"/></clipPath>
    <clipPath id="c6"><polygon points="400,170 440,330 300,330"/></clipPath>
    <clipPath id="c8"><polygon points="180,300 300,330 170,440"/></clipPath>
    <clipPath id="c9"><polygon points="180,300 170,440 80,310"/></clipPath>
    <clipPath id="c11"><polygon points="300,330 330,476 170,440"/></clipPath>
    <clipPath id="c2"><polygon points="270,36 255,200 120,150"/></clipPath>
    <clipPath id="c7"><polygon points="255,200 300,330 180,300"/></clipPath>
  </defs>

  <g clip-path="url(#gem)">
    <!-- silver crown -->
    <polygon points="270,36 400,170 255,200" fill="url(#t1)"/>
    <polygon points="270,36 255,200 120,150" fill="url(#t2)"/>
    <polygon points="120,150 255,200 180,300" fill="url(#t3)"/>
    <polygon points="120,150 180,300 80,310" fill="url(#t4)"/>
    <polygon points="255,200 400,170 300,330" fill="url(#t5)"/>
    <polygon points="255,200 300,330 180,300" fill="url(#t7)"/>

    <!-- obsidian pavilion -->
    <polygon points="400,170 440,330 300,330" fill="url(#b6)"/>
    <polygon points="180,300 300,330 170,440" fill="url(#b8)"/>
    <polygon points="180,300 170,440 80,310" fill="url(#b9)"/>
    <polygon points="300,330 440,330 330,476" fill="url(#b10)"/>
    <polygon points="300,330 330,476 170,440" fill="url(#b11)"/>

    <!-- glass reflections, clipped per facet -->
    <g clip-path="url(#c6)"><polygon points="330,150 365,150 330,340 295,340" fill="url(#glass)"/></g>
    <g clip-path="url(#c8)"><polygon points="190,290 225,290 215,450 180,450" fill="url(#glass)"/></g>
    <g clip-path="url(#c9)"><polygon points="90,300 125,300 135,450 100,450" fill="url(#glass)"/></g>
    <g clip-path="url(#c11)"><polygon points="215,320 250,320 255,480 220,480" fill="url(#glass)"/></g>

    <!-- brushed sheen on bright silver facets -->
    <g clip-path="url(#c2)"><polygon points="140,140 175,140 225,215 190,215" fill="#fff" opacity=".35" filter="url(#glow)"/></g>
    <g clip-path="url(#c7)"><polygon points="215,215 235,215 270,335 245,335" fill="#fff" opacity=".4" filter="url(#glow)"/></g>

    <!-- global depth -->
    <rect width="512" height="512" fill="url(#light)"/>
    <rect width="512" height="512" fill="url(#vignette)"/>

    <!-- facet edges: dark seam + thin bright bevel for a cut-gem look -->
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <g stroke="#000" stroke-opacity=".35" stroke-width="2.2">
        <path d="M270 36 L255 200 L120 150 M255 200 L400 170 M255 200 L180 300 L120 150 M255 200 L300 330 L180 300 M180 300 L80 310 M400 170 L300 330 L440 330 M300 330 L170 440 L180 300 M300 330 L330 476 M170 440 L80 310"/>
      </g>
      <g stroke="#fff" stroke-opacity=".6" stroke-width="1">
        <path d="M270 36 L255 200 L120 150 M255 200 L400 170 M255 200 L180 300 L120 150 M255 200 L300 330 L180 300 M180 300 L80 310"/>
      </g>
      <g stroke="#b4bccb" stroke-opacity=".5" stroke-width="1">
        <path d="M400 170 L300 330 L440 330 M300 330 L170 440 L180 300 M300 330 L330 476 M170 440 L80 310"/>
      </g>
    </g>

    <!-- specular glints -->
    <ellipse cx="198" cy="112" rx="42" ry="9" transform="rotate(-38 198 112)" fill="#fff" opacity=".6" filter="url(#glow)"/>
    <ellipse cx="184" cy="122" rx="16" ry="2.5" transform="rotate(-38 184 122)" fill="#fff" opacity=".95" filter="url(#soft)"/>
    <circle cx="410" cy="212" r="2.2" fill="#fff" opacity=".7" filter="url(#soft)"/>
  </g>

  <!-- beveled outline -->
  <polygon points="270,36 400,170 440,330 330,476 170,440 80,310 120,150" fill="none" stroke="url(#rim)" stroke-width="2" stroke-linejoin="round"/>
</svg>
