<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 455" width="440" height="455">

  <defs>
    <path id="neck" d="M165 245 C120 268 92 330 98 405 C150 418 218 388 240 330 L205 285 Z"/>
