<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Dashboard</title>
<link rel="icon" type="image/svg+xml" href="../../Sources/Icons/Qasthra.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>html{visibility:hidden}</style>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="../../style.css?v=21">
<style>
.dash{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:clamp(24px,5vw,64px) clamp(20px,5vw,48px)}
.dash h1 span{white-space:normal}
.dash .sub{margin-top:14px}
.dash-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:32px}
@media (min-width:561px){.dash-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}
.dash .badge{display:inline-block;margin-top:18px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font:600 12.5px/1 var(--font);color:var(--gray)}
.nav-user{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-user .email{font:600 13px/1 var(--font);color:var(--gray);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header class="nav" style="display:flex">
  <div class="nav-left"><a class="brand" href="../../index.html" aria-label="Qasthra">
    <img src="../../Sources/Icons/Qasthra.svg" alt="" width="28" height="28">
    <span>Qasthra</span>
  </a></div>
  <div class="nav-user">
    <button class="btn btn-second btn-nav" id="signOut" type="button" style="display:inline-flex;align-items:center;gap:8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l4 4-4 4"/><path d="M21 7H9a5 5 0 0 0-5 5"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h12a5 5 0 0 0 5-5"/></svg>
      <span>Switch</span>
    </button>
  </div>
</header>

<main class="dash">
  <h1>
    <span class="gray">Welcome back</span>
    <span class="mono" id="who">to your dashboard</span>
  </h1>
  <p class="sub">Manage your data and machines from one place.<br>Let your dashboard handle everything.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="dashboard.js?v=1"></script>
</body>
</html>
